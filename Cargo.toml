[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/controller"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "BSD-3-Clause"
authors = ["hikari <me@metantesan.com>"]
repository = "https://github.com/metantesan/fuin"

[workspace.dependencies]

# Kube
kube = { version = "4.2.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
schemars = { version = "1" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
[workspace.lints.clippy]
unwrap_used = "deny"
