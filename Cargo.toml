[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/controller"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "BSD-3-Clause"
authors = ["hikari <me@metantesan.com>"]
repository = "https://github.com/metantesan/fuin"

[workspace.dependencies]
fuin_core = { path = "crates/core" }
fuin_controller = { path = "crates/controller" }
# Errors
eyre = { version = "0.6" }
color-eyre = { version = "0.6" }
thiserror = { version = "2" }
# CLI
clap = { version = "4", features = ["derive", "color"] }
# Kube
kube = { version = "4.2", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
schemars = { version = "1" }
# Serilaztion 
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml_ng = { version = "0.10" }
futures = { version = "0.3" }
# Tokio
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Encryption
age = { version = "0.12", features = ["armor"] }


[workspace.lints.rust]
unsafe_code = "forbid"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"
[workspace.lints.clippy]
unwrap_used = "deny"
