apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fuinprivatekeys.fuin.abr.sh
spec:
  group: fuin.abr.sh
  scope: Namespaced
  names:
    plural: fuinprivatekeys
    singular: fuinprivatekey
    kind: FuinPrivateKey
    shortNames:
      - fpk
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - privateKey
              properties:
                privateKey:
                  type: string
                  description: Private key material used by Fuin for encryption and decryption.
                  minLength: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
