apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fuinpublickeys.fuin.abr.sh
spec:
  group: fuin.abr.sh
  scope: Cluster
  names:
    plural: fuinpublickeys
    singular: fuinpublickey
    kind: FuinPublicKey
    shortNames:
      - fpubk
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - publicKey
              properties:
                publicKey:
                  type: string
                  description: Public key used to encrypt values for Fuin.
                  minLength: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
