apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fuinsealedsecrets.fuin.abr.sh
spec:
  group: fuin.abr.sh
  scope: Namespaced
  names:
    plural: fuinsealedsecrets
    singular: fuinsealedsecret
    kind: FuinSealedSecret
    shortNames:
      - fss
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: STATUS
          type: string
          jsonPath: .status.phase
        - name: DATA
          type: integer
          jsonPath: .status.dataCount
        - name: AGE
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - encryptedData
              properties:
                encryptedData:
                  type: object
                  description: Map of secret keys to encrypted values.
                  additionalProperties:
                    type: string
                template:
                  type: object
                  description: Optional metadata and type for the generated Kubernetes Secret.
                  properties:
                    metadata:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type:
                      type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Current reconciliation state of the FuinSealedSecret.
                  enum:
                    - Pending
                    - Applied
                    - Failed
                message:
                  type: string
                  description: Human-readable details about the current phase.
                dataCount:
                  type: integer
                  format: int32
                  minimum: 0
                  description: Number of entries in spec.encryptedData.
                observedGeneration:
                  type: integer
                  format: int64
                  description: Most recent metadata.generation processed by the controller.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
